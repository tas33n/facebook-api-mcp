name: Publish to npm

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  test:
    name: Validate package
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to npmjs.org
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Use an OIDC-capable npm CLI
        run: npm install --global npm@11
      - name: Validate version and check registry
        id: version
        run: node scripts/check-version.mjs
      - name: Install package dependencies
        if: steps.version.outputs.should_publish == 'true'
        run: npm ci
      - name: Set actual provenance repository
        if: steps.version.outputs.should_publish == 'true'
        run: npm pkg set "repository.type=git" "repository.url=git+https://github.com/${GITHUB_REPOSITORY}.git"
      - name: Publish once with provenance
        if: steps.version.outputs.should_publish == 'true'
        run: npm publish --access public --provenance --tag "$DIST_TAG"
        env:
          DIST_TAG: ${{ steps.version.outputs.dist_tag }}
          # Optional for initial/token publishing; otherwise configure npm OIDC.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create GitHub release at the published commit
        if: steps.version.outputs.should_publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          DIST_TAG: ${{ steps.version.outputs.dist_tag }}
        run: |
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
          else
            EXTRA=()
            if [ "$DIST_TAG" != "latest" ]; then EXTRA+=(--prerelease); fi
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes "${EXTRA[@]}"
          fi
