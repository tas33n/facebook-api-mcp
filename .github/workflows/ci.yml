name: Offline validation

on:
  push:
    branches-ignore: [main]
    tags-ignore: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Ubuntu 24.04 / Node 24
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Offline fixture and package contract tests
        run: npm test
      - name: Check public declarations
        run: npm run typecheck
      - name: Check example syntax (no login)
        run: |
          node --check examples/cookie-login.js
          node --check examples/discover-posts.js
      - name: Check npm manifest without writing an archive
        run: npm pack --dry-run --ignore-scripts

      - name: Audit production and development dependencies
        run: npm audit --audit-level=low
